name: Reproduce evaluation evidence
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m unittest discover -s tests -v
      - run: python -m ragbench validate
      - run: python -m ragbench benchmark --output reports/ci --check
      - run: python scripts/check_regression.py reports/benchmark.json reports/ci/benchmark.json

